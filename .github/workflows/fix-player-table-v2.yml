name: Fix player table v2
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore players
        env:
          PAYLOAD: ""
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PLAYER_TABLE_RECOVERY_V3 -->'
          if marker not in s:
              addon=base64.b64decode(os.environ['PAYLOAD']).decode('utf-8')
              s=s.replace('</body>',addon+'\n</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Restore player table rendering"
          git push
