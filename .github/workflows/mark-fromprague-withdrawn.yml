name: Mark fromprague withdrawn
on:
  push:
    paths:
      - '.github/workflows/mark-fromprague-withdrawn.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bracket for withdrawal
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''.auto-win{background:rgba(64,190,120,.18)!important;box-shadow:inset 4px 0 0 #55d494}.withdrawn{background:rgba(220,75,75,.10)!important;color:#8d96a5;text-decoration:line-through}.status-pill{display:inline-flex;margin-left:7px;padding:2px 6px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.05em;text-transform:uppercase}.status-pill.win{border:1px solid #3d9f6c;color:#7ee0aa;background:rgba(61,159,108,.12)}.status-pill.out{border:1px solid #7b4545;color:#d78787;background:rgba(123,69,69,.12)}'''
          s=s.replace('</style>',css+'</style>',1)
          s=s.replace('<div class="match upper-match predict-match" id="m2" data-a="akage" data-b="fromprague" style="left:35px;top:200px"><div class="head">M2</div><div class="team"><span>akage</span><span>Seed 3</span></div><div class="team"><span>fromprague</span><span>Seed 4</span></div></div>', '<div class="match upper-match" id="m2" style="left:35px;top:200px"><div class="head">M2 · ТЕХ. ПОБЕДА</div><div class="team auto-win"><span>akage <span class="status-pill win">автопроход</span></span><span>ТП</span></div><div class="team withdrawn"><span>fromprague <span class="status-pill out">снялись</span></span><span>—</span></div></div>')
          s=s.replace('<span>Победитель M2</span>','<span>akage · ТП</span>',1)
          s=s.replace('<div class="match lower-match future-match" id="l2" style="left:30px;top:245px"><div class="head">L2</div><div class="team"><span>Проигравший M2</span></div><div class="team"><span>Проигравший M3</span></div></div>', '<div class="match lower-match" id="l2" style="left:30px;top:245px"><div class="head">L2 · BYE</div><div class="team withdrawn"><span>слот fromprague</span><span>снят</span></div><div class="team auto-win"><span>Проигравший M3 <span class="status-pill win">автопроход</span></span><span>BYE</span></div></div>')
          s=s.replace('<span>Победитель L2</span>','<span>Проигравший M3 · BYE</span>',1)
          s=s.replace("m2:['fromprague','akage']","m2:['akage','fromprague']")
          s=s.replace("setFuture('usf1','rusa i 4 silnih','fromprague','rusa i 4 silnih','fromprague')","setFuture('usf1','rusa i 4 silnih','akage','rusa i 4 silnih','akage')")
          s=s.replace("setFuture('l2','akage','anverr','akage','anverr')","setFuture('l2','слот fromprague','anverr','anverr','слот fromprague')")
          s=s.replace("setFuture('l4','akage','fromprague','fromprague','akage')","setFuture('l4','anverr','akage','akage','anverr')")
          s=s.replace("setFuture('l5','yowhymore','fromprague','fromprague','yowhymore')","setFuture('l5','yowhymore','akage','akage','yowhymore')")
          s=s.replace("setFuture('l6','fromprague','rusa i 4 silnih','rusa i 4 silnih','fromprague')","setFuture('l6','akage','rusa i 4 silnih','rusa i 4 silnih','akage')")
          s=s.replace('В случае победы команды fromprague призовые выплаты данной команде не производятся.','Команда fromprague снялась с турнира. Команде akage засчитана техническая победа в M2, а проигравший M3 автоматически проходит через освободившийся слот Lower Bracket.')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Mark fromprague withdrawn and add automatic advances"
          git push
