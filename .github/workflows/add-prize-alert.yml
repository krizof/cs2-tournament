name: Add fromprague prize alert
on:
  push:
    paths:
      - '.github/workflows/add-prize-alert.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch rules alert
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='.prize-alert{margin:0 0 14px;padding:15px 17px;border:1px solid #8d5b36;border-left:4px solid #ff8a4c;border-radius:12px;background:linear-gradient(90deg,rgba(255,125,70,.16),rgba(255,125,70,.06));color:#ffd8c2;font-size:14px;font-weight:800;line-height:1.5;box-shadow:0 8px 24px rgba(0,0,0,.12)}.prize-alert strong{color:#fff1e8}'
          if '.prize-alert{' not in s:
              s=s.replace('</style>',css+'</style>',1)
          marker='<section class="page" id="rules"><div class="hero"><div><h2>Регламент турнира</h2><p>30 августа · 19:00 МСК</p></div></div><div class="rules-grid">'
          replacement='<section class="page" id="rules"><div class="hero"><div><h2>Регламент турнира</h2><p>30 августа · 19:00 МСК</p></div></div><div class="prize-alert"><strong>Важно:</strong> в случае победы команды fromprague призовые выплаты данной команде не производятся.</div><div class="rules-grid">'
          if marker in s:
              s=s.replace(marker,replacement,1)
          elif 'class="prize-alert"' not in s:
              raise SystemExit('Rules marker not found')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Add highlighted fromprague prize rule"
          git push
