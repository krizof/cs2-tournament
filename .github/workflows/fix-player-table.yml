function init(){
  const sec=document.getElementById('players'); if(!sec) return;
  const tbody=sec.querySelector('tbody'); const inp=sec.querySelector('input'); const sel=sec.querySelector('select');
  if(!tbody) return;
  if(sel){
    const old=sel.value;
    sel.innerHTML='<option value="">Все команды</option>'+[...new Set(P.map(x=>x[0]))].map(x=>'<option value="'+x.replace(/"/g,'&quot;')+'">'+x+'</option>').join('');
    if([...sel.options].some(o=>o.value===old)) sel.value=old;
  }
  const link=n=>'https://www.faceit.com/ru/players/'+encodeURIComponent(n);
  function pct(v){return v==='—'?'—':v+'%'}
  function render(){
    const q=(inp?.value||'').trim().toLowerCase(), f=sel?.value||'';
    const rows=P.filter(x=>(!f||x[0]===f)&&(!q||(x[0]+' '+x[1]+' '+x[2]).toLowerCase().includes(q)));
    tbody.innerHTML=rows.map(x=>`<tr class="${x[10]?'replacement':''}"><td><span class="team-dot"></span>${x[0]}</td><td class="player-name">${x[1]}${x[10]?'<span class="rbadge">ЗАМЕНА</span>':''}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${pct(x[5])}</td><td>${x[6]}</td><td>${x[7]}</td><td>${pct(x[8])}</td><td><a class="faceit-link" target="_blank" rel="noopener" href="${link(x[2])}">Открыть FACEIT ↗</a></td></tr>`).join('');
  }
  if(inp) inp.addEventListener('input',render); if(sel) sel.addEventListener('change',render); render();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init); else init();
