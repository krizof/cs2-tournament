name: Fix player table
on:
  push:
    paths:
      - '.github/workflows/fix-player-table.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore player table rendering
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- PLAYER_TABLE_RECOVERY_V2 -->'
          if marker in s:
              raise SystemExit('already patched')
