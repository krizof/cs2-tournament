name: Fix player table static
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve bracket team name sizing
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old='.team{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-top:1px solid #313a49;font-size:14px;font-weight:800}.team span:last-child{font-size:10px;color:#858fa0;font-weight:600}'
          new='.team{height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 11px;border-top:1px solid #313a49;font-size:12.5px;font-weight:800}.team span:first-child{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team span:last-child{flex:0 0 auto;font-size:10px;color:#858fa0;font-weight:600}'
          if old in s:
              s=s.replace(old,new,1)
          elif '.team span:first-child{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' not in s:
              s=s.replace('.team span:last-child{font-size:10px;color:#858fa0;font-weight:600}', '.team span:first-child{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.team span:last-child{flex:0 0 auto;font-size:10px;color:#858fa0;font-weight:600}',1)
              s=s.replace('font-size:14px;font-weight:800}.team span:first-child', 'font-size:12.5px;font-weight:800}.team span:first-child',1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Improve bracket team name sizing"
          git push
