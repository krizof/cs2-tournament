name: Fix player table static
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Finalize tournament
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          NEW='3HAKOMbIE_SKYWALKERA'

          def repl(mid, html):
              global s
              pat=rf'<div class="match [^"]*" id="{re.escape(mid)}".*?</div></div>'
              s,n=re.subn(pat,html,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{mid} not found')

          done='border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)'

          repl('gf', f'''<div class="match grand predict-match" id="gf" data-a="{NEW}" data-b="TEAM TARKOV" style="left:1025px;top:265px;{done}"><div class="head">GRAND FINAL · BO3 · ЗАВЕРШЕН</div><div class="team"><span>{NEW}</span><span style="color:#56d294;font-weight:900">2 · WIN</span></div><div class="team"><span>TEAM TARKOV</span><span style="color:#ff7058;font-weight:900">0</span></div></div>''')

          # Champion banner above the bracket. Idempotent: replace existing banner or insert once.
          banner=f'''<div id="championBanner" style="margin:0 0 18px;padding:18px 20px;border:1px solid #a38528;border-left:5px solid #e8c15d;border-radius:14px;background:linear-gradient(90deg,rgba(232,193,93,.18),rgba(232,193,93,.06));box-shadow:0 10px 30px rgba(0,0,0,.18)"><div style="font-size:11px;font-weight:900;letter-spacing:.14em;color:#e8c15d;text-transform:uppercase;margin-bottom:6px">ПОБЕДИТЕЛЬ ТУРНИРА</div><div style="font-size:25px;font-weight:900;color:#fff">{NEW}</div><div style="margin-top:5px;color:#c7cfda;font-size:13px">Победа в Grand Final 2:0 над TEAM TARKOV</div></div>'''
          if 'id="championBanner"' in s:
              s=re.sub(r'<div id="championBanner".*?</div></div>', banner, s, count=1, flags=re.S)
          else:
              marker='<section class="page active" id="bracket">'
              if marker in s:
                  s=s.replace(marker, marker+banner, 1)
              else:
                  raise SystemExit('bracket section marker not found')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Finalize tournament with champion"
          git push
