name: Fix player table static
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update first completed matches
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          replacements={
            '<span>rusa i 4 silnih</span><span>Seed 2</span>':'<span>rusa i 4 silnih</span><span style="color:#56d294;font-weight:900">1 · WIN</span>',
            '<span>4Uncalib</span><span>Seed 5</span>':'<span>4Uncalib</span><span style="color:#ff7058;font-weight:900">0</span>',
            '<span>sbyrezz</span><span>Seed 1</span>':'<span>sbyrezz</span><span style="color:#56d294;font-weight:900">1 · WIN</span>',
            '<span>team S4MIBD</span><span>Seed 7</span>':'<span>team S4MIBD</span><span style="color:#ff7058;font-weight:900">0</span>',
            '<span>Победитель M1</span>':'<span>rusa i 4 silnih</span>',
            '<span>Победитель M3</span>':'<span>sbyrezz</span>',
            '<span>Проигравший M1</span>':'<span>4Uncalib</span>',
            '<span>Проигравший M3</span>':'<span>team S4MIBD</span>',
          }

          for old,new in replacements.items():
              s=s.replace(old,new)

          # Mark completed Round 1 cards visually without changing bracket geometry.
          s=s.replace('id="m1" data-a=', 'id="m1" style="border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)" data-a=', 1) if 'id="m1" style=' not in s else s
          s=s.replace('id="m3" data-a=', 'id="m3" style="border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)" data-a=', 1) if 'id="m3" style=' not in s else s

          # The cards already have positioning styles later in the tag. Merge duplicate style attributes safely.
          s=s.replace('id="m1" style="border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)" data-a="rusa i 4 silnih" data-b="4Uncalib" style="left:35px;top:70px"',
                      'id="m1" data-a="rusa i 4 silnih" data-b="4Uncalib" style="left:35px;top:70px;border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)"')
          s=s.replace('id="m3" style="border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)" data-a="sbyrezz" data-b="team S4MIBD" style="left:35px;top:330px"',
                      'id="m3" data-a="sbyrezz" data-b="team S4MIBD" style="left:35px;top:330px;border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)"')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update bracket after M1 and M3"
          git push
