name: Fix player table static
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update lower final result
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          NEW='3HAKOMbIE_SKYWALKERA'

          def repl(mid, html):
              global s
              pat=rf'<div class="match [^"]*" id="{re.escape(mid)}".*?</div></div>'
              s,n=re.subn(pat,html,s,count=1,flags=re.S)
              if n!=1:
                  raise SystemExit(f'{mid} not found')

          done='border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)'

          repl('l6', f'''<div class="match lower-match final predict-match" id="l6" data-a="rusa i 4 silnih" data-b="TEAM TARKOV" style="left:1020px;top:170px;{done}"><div class="head">LOWER FINAL · BO3 · ЗАВЕРШЕН</div><div class="team"><span>rusa i 4 silnih</span><span style="color:#ff7058;font-weight:900">1</span></div><div class="team"><span>TEAM TARKOV</span><span style="color:#56d294;font-weight:900">2 · WIN</span></div></div>''')

          repl('gf', f'''<div class="match grand future-match" id="gf" data-a="{NEW}" data-b="TEAM TARKOV" style="left:1025px;top:265px"><div class="head">GRAND FINAL · BO3</div><div class="team"><span>{NEW}</span></div><div class="team"><span>TEAM TARKOV</span></div></div>''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update lower final result and grand final"
          git push
