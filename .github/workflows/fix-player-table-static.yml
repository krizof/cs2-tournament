name: Fix player table static
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update live bracket state
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def replace_match(match_id, html):
              global s
              pattern=rf'<div class="match [^"]*" id="{re.escape(match_id)}".*?</div></div>'
              s,n=re.subn(pattern, html, s, count=1, flags=re.S)
              if n!=1:
                  raise SystemExit(f'{match_id} not found')

          done_style='border-color:#3d9f6c;box-shadow:0 0 0 1px rgba(86,210,148,.18)'

          replace_match('uf', f'''<div class="match final predict-match" id="uf" data-a="rusa i 4 silnih" data-b="sbyrezz" style="left:695px;top:265px;{done_style}"><div class="head">UPPER FINAL · BO1 · ЗАВЕРШЕН</div><div class="team"><span>rusa i 4 silnih</span><span style="color:#ff7058;font-weight:900">0</span></div><div class="team"><span>sbyrezz</span><span style="color:#56d294;font-weight:900">1 · WIN</span></div></div>''')

          replace_match('gf', '''<div class="match grand future-match" id="gf" style="left:1025px;top:265px"><div class="head">GRAND FINAL · BO3</div><div class="team"><span>sbyrezz</span></div><div class="team"><span>Lower Champion</span></div></div>''')

          replace_match('l1', f'''<div class="match lower-match predict-match" id="l1" data-a="4Uncalib" data-b="execute" style="left:30px;top:95px;{done_style}"><div class="head">LOWER R1 · L1 · ЗАВЕРШЕН</div><div class="team"><span>4Uncalib</span><span style="color:#56d294;font-weight:900">1 · WIN</span></div><div class="team"><span>execute</span><span style="color:#ff7058;font-weight:900">0</span></div></div>''')

          replace_match('l2', f'''<div class="match lower-match predict-match" id="l2" data-a="team S4MIBD" data-b="Discipline Team" style="left:30px;top:245px;{done_style}"><div class="head">LOWER R1 · L2 · ЗАВЕРШЕН</div><div class="team"><span>team S4MIBD</span><span style="color:#56d294;font-weight:900">1 · WIN</span></div><div class="team"><span>Discipline Team</span><span style="color:#ff7058;font-weight:900">0</span></div></div>''')

          replace_match('l3', '''<div class="match lower-match future-match" id="l3" data-a="heart attack" data-b="4Uncalib" style="left:360px;top:95px"><div class="head">LOWER R2 · L3</div><div class="team"><span>heart attack</span></div><div class="team"><span>4Uncalib</span></div></div>''')

          replace_match('l4', '''<div class="match lower-match future-match" id="l4" data-a="TEAM TARKOV" data-b="team S4MIBD" style="left:360px;top:245px"><div class="head">LOWER R2 · L4</div><div class="team"><span>TEAM TARKOV</span></div><div class="team"><span>team S4MIBD</span></div></div>''')

          replace_match('l6', '''<div class="match lower-match final future-match" id="l6" style="left:1020px;top:170px"><div class="head">LOWER FINAL · BO3 · L6</div><div class="team"><span>Победитель L5</span></div><div class="team"><span>rusa i 4 silnih</span></div></div>''')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit bracket update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update live tournament bracket"
          git push
# refreshed 2026-08-30