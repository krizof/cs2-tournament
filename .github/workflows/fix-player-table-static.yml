name: Fix player table static
on:
  push:
    paths:
      - '.github/workflows/fix-player-table-static.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix match formats
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Только Lower Final и Grand Final играются BO3.
          s=s.replace('UPPER FINAL · BO3', 'UPPER FINAL · BO1')
          s=s.replace('LOWER FINAL · L6', 'LOWER FINAL · BO3 · L6')

          # Поправляем возможные формулировки в регламенте.
          replacements = {
              'Upper Final и Grand Final — BO3': 'Lower Final и Grand Final — BO3',
              'Upper Final + Grand Final — BO3': 'Lower Final + Grand Final — BO3',
              'Upper Final и Grand Final — BO3.': 'Lower Final и Grand Final — BO3.',
              'Upper Final + Grand Final — BO3.': 'Lower Final + Grand Final — BO3.',
              'Upper Final и Grand Final BO3': 'Lower Final и Grand Final BO3',
              'Upper Final + Grand Final BO3': 'Lower Final + Grand Final BO3',
              'Большинство матчей BO1. Upper Final и Grand Final — BO3.': 'Все матчи BO1, кроме Lower Final и Grand Final — они BO3.',
              'Большинство матчей — BO1. Upper Final и Grand Final — BO3.': 'Все матчи BO1, кроме Lower Final и Grand Final — они BO3.',
          }
          for old,new in replacements.items():
              s=s.replace(old,new)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit format update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use BO3 only for lower final and grand final"
          git push
